apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: course-db-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi-lrs
  resources:
    requests:
      storage: 1Gi
