name: 04 - Configuration Drift Detection

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-dr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan (drift check)
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -no-color
          echo "exitcode=$?" >> $GITHUB_OUTPUT
        env:
          TF_VAR_postgres_admin_password: ${{ secrets.TF_VAR_postgres_admin_password }}

      - name: Report drift
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::Configuration drift detected. Run terraform plan locally and reconcile."
          exit 1

      - name: No drift
        if: steps.plan.outputs.exitcode == '0'
        run: echo "No configuration drift detected."