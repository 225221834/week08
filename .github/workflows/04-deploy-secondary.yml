name: 04 - Deploy to Secondary Region

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA/Tag tested in Primary region'
        required: true

jobs:
  deploy-secondary:
    runs-on: ubuntu-latest
    environment: secondary-region

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Secondary AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ vars.AKS_SECONDARY_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_SECONDARY_CLUSTER_NAME }}

      - name: Create secondary namespace
        run: |
          kubectl create namespace secondary \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace secondary \
            --from-literal=POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace secondary \
            --from-literal=POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --from-literal=JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}' \
            --from-literal=DEFAULT_ADMIN_USERNAME='${{ secrets.DEFAULT_ADMIN_USERNAME }}' \
            --from-literal=DEFAULT_ADMIN_EMAIL='${{ secrets.DEFAULT_ADMIN_EMAIL }}' \
            --from-literal=DEFAULT_ADMIN_PASSWORD='${{ secrets.DEFAULT_ADMIN_PASSWORD }}' \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING='${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          # Skip 01-namespace.yaml (it hard-codes "staging")
          kubectl apply -n secondary \
            -f kubernetes/staging/02-user-db.yaml \
            -f kubernetes/staging/03-student-db.yaml \
            -f kubernetes/staging/04-lecturer-db.yaml \
            -f kubernetes/staging/05-course-db.yaml \
            -f kubernetes/staging/06-enrollment-db.yaml \
            -f kubernetes/staging/07-user-service.yaml \
            -f kubernetes/staging/08-student-service.yaml \
            -f kubernetes/staging/09-lecturer-service.yaml \
            -f kubernetes/staging/10-course-service.yaml \
            -f kubernetes/staging/11-enrollment-service.yaml \
            -f kubernetes/staging/12-frontend.yaml

      - name: Update images
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ env.IMAGE_TAG }} \
            -n secondary

          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ env.IMAGE_TAG }} \
            -n secondary

          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ env.IMAGE_TAG }} \
            -n secondary

          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ env.IMAGE_TAG }} \
            -n secondary

          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ env.IMAGE_TAG }} \
            -n secondary

          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ env.IMAGE_TAG }} \
            -n secondary

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/frontend -n secondary --timeout=300s
          kubectl rollout status deployment/user-service -n secondary --timeout=300s
          kubectl rollout status deployment/student-service -n secondary --timeout=300s
          kubectl rollout status deployment/lecturer-service -n secondary --timeout=300s
          kubectl rollout status deployment/course-service -n secondary --timeout=300s
          kubectl rollout status deployment/enrollment-service -n secondary --timeout=300s

      - name: Show resources
        run: |
          kubectl get pods,svc,ingress -n secondary