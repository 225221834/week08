name: 02 - Deploy to Staging (Multi-Region)

on:
  workflow_run:
    workflows: ["01 - CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: [primary, secondary]
    environment: ${{ matrix.region }}-region

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context (Primary Region)
        if: matrix.region == 'primary'
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ vars.AKS_PRIMARY_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_PRIMARY_CLUSTER_NAME }}

      - name: Set AKS Context (Secondary Region)
        if: matrix.region == 'secondary'
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ vars.AKS_SECONDARY_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_SECONDARY_CLUSTER_NAME }}

      - name: Create Staging Namespace
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes Secret from Environment
        run: |
          kubectl create secret generic app-secrets \
            --namespace=staging \
            --from-literal=POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --from-literal=JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}' \
            --from-literal=DEFAULT_ADMIN_USERNAME='${{ secrets.DEFAULT_ADMIN_USERNAME }}' \
            --from-literal=DEFAULT_ADMIN_EMAIL='${{ secrets.DEFAULT_ADMIN_EMAIL }}' \
            --from-literal=DEFAULT_ADMIN_PASSWORD='${{ secrets.DEFAULT_ADMIN_PASSWORD }}' \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING='${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Staging Manifests
        run: |
          kubectl apply -f k8s/ -n staging