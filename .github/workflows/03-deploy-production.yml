name: 03 - Deploy to Production (Multi-Region)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA that passed staging"
        required: true

jobs:
  deploy-production:
    name: Deploy to Production (${{ matrix.region }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: [primary, secondary]
    environment:
      name: ${{ matrix.region }}-region

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Primary AKS credentials
        if: matrix.region == 'primary'
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_PRIMARY_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_PRIMARY_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Get Secondary AKS credentials
        if: matrix.region == 'secondary'
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_SECONDARY_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_SECONDARY_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --from-literal=JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}' \
            --from-literal=DEFAULT_ADMIN_USERNAME='${{ secrets.DEFAULT_ADMIN_USERNAME }}' \
            --from-literal=DEFAULT_ADMIN_EMAIL='${{ secrets.DEFAULT_ADMIN_EMAIL }}' \
            --from-literal=DEFAULT_ADMIN_PASSWORD='${{ secrets.DEFAULT_ADMIN_PASSWORD }}' \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING='${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -f kubernetes/production/ -n production

      - name: Update images
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ env.IMAGE_TAG }} -n production
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ env.IMAGE_TAG }} -n production
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ env.IMAGE_TAG }} -n production
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ env.IMAGE_TAG }} -n production
          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ env.IMAGE_TAG }} -n production
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ env.IMAGE_TAG }} -n production

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/frontend -n production --timeout=300s
          kubectl rollout status deployment/user-service -n production --timeout=300s
          kubectl rollout status deployment/student-service -n production --timeout=300s
          kubectl rollout status deployment/lecturer-service -n production --timeout=300s
          kubectl rollout status deployment/course-service -n production --timeout=300s
          kubectl rollout status deployment/enrollment-service -n production --timeout=300s

      - name: Show resources
        run: |
          kubectl get pods,svc,pvc -n production